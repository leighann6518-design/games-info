pen{display:flex}.modal{width:min(820px,100%);background:var(--paper);border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.2);overflow:hidden}.modal-head{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:2}.modal-head strong{flex:1}.close{border:0;background:#f0f3f1;width:34px;height:34px;border-radius:10px;font-size:19px;cursor:pointer}.modal-body{padding:24px}.detail-title{font-size:27px;line-height:1.25;letter-spacing:-.03em;margin:8px 0 8px}.detail-lead{font-size:16px;color:#53645e;margin:0 0 22px}.detail-section{padding:17px 0;border-top:1px solid var(--line)}.detail-section h4{margin:0 0 8px;font-size:14px}.detail-section p{margin:0;color:#45554f}.source-list{margin:8px 0 0;padding-left:18px}.source-list li{margin:7px 0}.source-list a{color:var(--green);word-break:break-all}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{background:var(--amber-soft);color:#6f5624;border:1px solid #eadcb8;padding:11px 13px;border-radius:12px;font-size:12px;margin-bottom:16px}.toast{position:fixed;right:20px;bottom:20px;background:#17372e;color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:120;display:none}.toast.show{display:block}.view{display:none}.view.active{display:block}.small-note{font-size:12px;color:var(--muted);margin-top:10px}.footer{margin-top:38px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}.bulk-actions{display:flex;gap:8px;flex-wrap:wrap}.counter{font-size:12px;color:var(--muted);font-weight:700}.read-indicator{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.read-indicator::before{content:"";width:6px;height:6px;border-radius:50%;background:#87a198}.item:not(.read) .read-indicator::before{background:#e5843a}.item:not(.read) .read-indicator{color:#9a5b28}.kicker{color:var(--muted);font-s <script>
const issues=[
{"issue_id":"2026-09-28-bounded-ai-and-deeper-funnel","title":"本周增量：让 AI 做受限判定，把互动漏斗看到“第二次动作”","date":"2026-09-28","range":"增量核验 · 2026-09-21 08:04 至 2026-09-28 08:48（北京时间）","summary":{"play":"本周最值得验证的是把 AI 放进边界清晰、需要实时响应的主持/判定角色，而不是继续批量生成题材。9 月 25 日出现的 AI 海龟汤项目同时给出正反两面：受限判定能替代真人主持，但原始用户反馈也指出纯 AI 题目容易无聊。建议用精选题库 + AI 主持，优先验证首问、第二问、完局与复玩。","product":"9 月 22 日的跨平台采访进一步显示，曝光、点击和真正开玩之间可能存在明显损耗，且头部体验量可能集中在已有粉丝基础的创作者。下一轮产品验证应把漏斗至少拆到首次有效操作、第二次动作、重试、后续广场消费和 D1/D7 回访，并把关键退出点反馈给创作者。"},"messages":[{"id":"jev-turtle-soup-bounded-host-20260925","track":"play","platform":"哔哩哔哩 Toy / 开源项目","topic":"受限AI主持","title":"让 AI 做“受限判定器”，比让它包办内容更接近稳定玩法","desc":"9 月 25 日，一位开发者公开了 Jev 海龟汤，并提供 B站 Toy 点击即玩版本。核心不是让模型无限生成剧情，而是让 AI 在“是 / 否 / 无关 / 无法确定”的窄决策空间里担任主持人；原始社区反馈同时指出，纯 AI 生成题目容易无聊。","fact":"事件与主要来源发布日期均为 2026-09-25，本次核验于 2026-09-28。B站视频页提供在线体验、Toy 点击即玩和开源仓库链接；公开 README 写明 Jev 每次只做“是 / 否 / 无关”判断并给出置信度，拿不准时可返回“无法确定”，内置约 30 道题，同时支持玩家投稿后经 AI 审核进入公开题库。开发者在 Linux.do 说明选择 Jev 的原因是传统大模型生成/推理较慢且可能泄露汤底；同帖一条原始用户反馈认为题目像 AI 生成、比较无聊。公开页面未说明地域或账号限制，Toy 实际可用范围仍需以站内当次访问为准。","analysis":"AI 的实质增益在这里是替代必须实时在线的人类主持人，让单人也能随时通过自然语言提问；同时把模型限制在小输出空间，可降低跑题和剧透风险。第一次乐趣应发生在玩家提出首个有效问题后得到一个意外但合理的判定，目标可压在进入后 20–60 秒。反证正是社区对 AI 题目“无聊”的反馈，说明题库质量仍是核心，AI 更适合主持而非包办内容。","decision":"做一个 7 天小样本：只用人工/创作者精选的 20 道题，AI 仅负责封闭式判定和最终还原评分，不生成汤面。单局限制 12 次提问并提供 2 次提示。重点看进入→首问时长、首问→第二问比例、完局率、同日第二局率、D1 回访，以及人工抽查的错误判定/泄底率。分享链路让接收者直接进入同一道题挑战；若复玩低或判定错误高，则不扩大题库。","limits":"这是单个开发者项目和早期社区反馈，B站视频规模不能代表大众需求；模型延迟、成本和判定准确率没有独立压力测试。Linux.do 的一条负面评论只可作为反证线索，不能代表总体用户评价。","sources":[{"label":"B站 · Jev模型作为AI海龟汤主持人","url":"https://www.bilibili.com/video/BV13nhy6xEqu/"},{"label":"GitHub · ZeroTang05/Situation-Puzzle","url":"https://github.com/ZeroTang05/Situation-Puzzle"},{"label":"Linux.do · 开发者发布与原始反馈","url":"https://linux.do/t/topic/2951604"}]},{"id":"interaction-funnel-beyond-click-20260922","track":"product","platform":"多平台（媒体核验）","topic":"分发与回访漏斗","title":"别把“曝光→点击”当成互动内容漏斗，至少要看到第二次动作和回访","desc":"9 月 22 日《北京晚报》对 B站、小红书、抖音、快手的 AI 互动内容做了横向观察，给出了一个值得产品侧立即验证的信号：头部互动内容可以获得显著体验量，但大量作品仍停留在几百到几千浏览，且曝光转成真正开玩、再转成关注或回访存在明显损耗。","fact":"来源发布于 2026-09-22，本次核验于 2026-09-28。报道写明：B站 Toy 内测一个多月用户体验量累计超 850 万次、UP 主上传超 300 件作品；记者观察的高流量案例多来自已有一定粉丝基础的创作者。报道还列出小红书 9 月 3 日 RED Skill 榜单中第 1 名使用人数 17,966、第 10 名 2,001、第 100 名 390；一位受访创作者称其最高一条视频有 8 万浏览，但后台真正玩游戏的人不到 15%，流量扶持停止后数据明显下跌。以上均为媒体报道、记者观察和个案访谈，不是平台官方统一口径。","analysis":"这些外部信号不能证明本站的核心瓶颈，但足以说明只看作品数、曝光或点击会把问题混在一起：可能是推荐没有送到对的人、作品入口解释成本高、第一次操作后没有第二步，或玩完后没有继续消费理由。对供给质量也一样，创作者需要知道玩家在哪一步退出，才能判断应该改题材、规则、难度还是首屏表达。","decision":"把消费漏斗统一为：曝光→打开作品→首次有效操作→第二次有效操作→完成/失败→重试→收藏/关注→同日继续消费其他作品→D1/D7 回访，并让创作者后台至少看到前四步和退出点。首批分发先给匹配兴趣的 30–100 名真实用户，不以广撒曝光作为成功标准。成功信号是第二次动作率、重试率和后续广场消费同步改善；若只提升打开率，则回滚分发策略或首屏包装。","limits":"核心数字来自新闻采访和记者观察，跨平台口径不可直接比较；受访创作者是单一个案，报道没有给出完整样本和统计方法。不能据此断言本站也存在相同转化率或创作者集中度，只能作为验证优先级的外部证据。","sources":[{"label":"北京晚报 · AI互动内容会是下一个风口吗？","url":"https://bjwb-app.bjd.com.cn/content/s6ab215afe4b0e42f8f00a572.html"}]}]},
{issue_id:"2026-09-21-feed-first-and-edit-depth",title:"本周增量：第一下互动前移，生成后的“继续改”成为质量变量",date:"2026-09-21",range:"增量核验 · 2026-09-14 08:48 至 2026-09-21 08:04（北京时间）",summary:{play:"本周最值得低成本验证的玩法方向不是新增题材，而是把“第一下互动”前移到用户原本就在消费的推荐流里。抖音“AI工坊/兴趣卡”目前只有可追溯的媒体内测线索、尚无官方公告和效果数据，因此只作为待核验实验方向：比较刷到即互动与点击进入完整作品，对首次有效操作和后续广场消费的影响。",product:"更明确的两条新增信号都指向“生成之后”：B站 9 月 15 日案例公开呈现初版 Demo 到当前版本的迭代，Aippy 9 月 15 日用户评价则直接指出 3D 世界编辑深度不足。优先验证同一作品的连续修改、局部编辑和版本反馈，可能比继续扩充生成类型更直接改善有效供给。"},messages:[
{id:"douyin-feed-native-interest-card-20260914",track:"play",platform:"抖音（媒体线索）",topic:"信息流原生互动",title:"先在推荐流完成第一下互动，再决定是否进入完整作品",desc:"9 月 15 日公开报道援引 9 月 14 日的内测信息称，抖音正在小范围测试“AI工坊”，其“兴趣卡”进入首页推荐流灰度，用户可在卡片内完成问答、测试、生成和轻量互动。若这一形态得到官方确认，真正值得验证的是把首次乐趣压缩到一次刷到后的 3–10 秒，而不是再做一个独立广场入口。",fact:"媒体线索，事件日期按报道为 2026-09-14，来源发布于 2026-09-15，本次核验于 2026-09-21。报道描述“AI工坊”为创作者中心小范围邀请制内测，兴趣卡在首页推荐流灰度测试，用户无需跳小程序即可在卡片内完成轻量互动；报道还称创作区支持自然语言、实时预览和发布。当前未找到抖音官方公告或公开产品规则页可独立确认。",analysis:"如果“刷到即玩”成立，它改变的是首次互动发生的位置：用户无需先理解作品、进入广场再决定是否玩，而是先完成一个低成本动作，再由结果决定是否继续。这与单纯把链接挂在内容下方不同，可能更适合测试、生成器、单步选择和反应型玩法；但推荐流曝光能否带来更深互动、是否挤压视频消费，公开资料没有数据。",decision:"做一个不改变现有广场架构的最小实验：选 3 个作品各抽出一个 3–10 秒即可完成的核心动作，做成信息流预览卡，并与“卡片仅展示 + 点击进入完整作品”对照。关注曝光→首次有效操作率、第二次操作率、进入完整作品率、随后 24 小时广场消费和回访；若只提高浅层点击、不提高后续消费，则停止扩大。",limits:"这是媒体线索而非抖音官方确认；开放范围据报道为邀请制/灰度，覆盖账号、地区、审核标准和真实交互能力未知，也没有留存或 DAU 效果数据。只能作为待核验的实验方向，不能写成已验证行业结论。",sources:[{label:"搜狐时间线 / GPLP看科技 · 抖音AI工坊内测线索",url:"https://timeline.sohu.com/news/ODp1RV6I4v"}]},
{id:"bilibili-toy-zero-basis-revision-20260915",track:"product",platform:"哔哩哔哩 Toy",topic:"创作迭代",title:"零基础创作案例开始展示“初版 Demo → 当前版本”，不只是一次生成",desc:"9 月 15 日，B站 UP 主张鱼烧Tako 发布一款 AI 辅助制作的明日方舟主题小游戏，明确称自己在零基础情况下体验了做游戏，并给出 Toy“点击即玩”链接；视频同时保留“初版demo”和“目前版本”。这个新增信号最值得关注的是版本迭代链路，而不是视频播放量。",fact:"事件与来源发布日期均为 2026-09-15，本次核验于 2026-09-21。B站视频页标注“含AI生成内容”，描述写有“点击即玩”的 Toy 链接，作者称 AI 让其在零基础情况下体验做游戏；视频选集同时列出“目前版本”和“初版demo”。B站 Toy 官方介绍确认平台支持站内直接体验、发布后继续更新，并说明当前发布面向邀请 UP 主逐步开放。",analysis:"单次生成已经越来越容易，供给质量更可能取决于第一次生成之后能否继续改、是否知道改什么，以及修改是否稳定保留在同一作品里。这个案例提供了一个可观察的“创作—版本迭代—分发”路径，但不能证明 AI 或 Toy 导致了视频播放，也不能证明游戏本身留存好。",decision:"把新手创作漏斗拆成：首个可运行版本→首次二次修改→第二版发布→获得首批玩家反馈→第三次修改。优先验证同一作品连续编辑、版本对比和可回退；观察首次修改成功率、第二版发布率，以及首个玩家反馈到下一次修改的时间。若大量用户只生成首版后放弃，再考虑把资源从新增生成入口转向修改引导。",limits:"单一 UP 主案例；当前研究环境无法打开该具体 Toy 实例，因此具体玩法、实际开玩率、玩家行为和两个版本的功能差异未独立核验。页面显示的 18.4 万是视频播放量，不是游戏玩家数；Toy 发布权限仍为邀请制逐步开放。",sources:[{label:"B站 · 张鱼烧Tako 2026-09-15 视频",url:"https://www.bilibili.com/video/BV1Dae56jE5s/"},{label:"哔哩哔哩 Toy · 官方介绍",url:"https://www.bilibili.com/toy/intro"}]},
{id:"aippy-3d-edit-depth-feedback-20260915",track:"product",platform:"Aippy",topic:"编辑深度",title:"“能生成 3D”与“能把 3D 改到满意”之间仍有体验缝隙",desc:"Aippy 当前 Google Play 页面把 3D experiments、Custom Assets 等列为创作能力；同一页面 9 月 15 日的一条新用户评价则认为 3D 创作选项不够深入，希望能进一步编辑 3D world building。单条评价不能代表总体，但它直接提醒：支持某种生成类型，不等于创作者拥有足够的修改深度。",fact:"来源为 Google Play 当前 Aippy 页面，本次核验于 2026-09-21。官方商店描述写明可通过提示生成 mini games、interactive art、puzzles、hand-tracking games 和 3D experiments，并可上传自定义素材；应用页面显示最近更新日期为 2026-08-27，因此这不是本周新增功能。新增的是一条 2026-09-15 用户评价：评价者称 3D 创建选项“lacking”，希望更深入进行 3D world building。",analysis:"如果创作者只能通过重新生成来修正，而不能稳定修改局部规则、空间结构或素材，平台就可能出现“看起来什么都能做、作品却普遍浅”的供给质量问题。对现阶段更重要的指标可能不是支持了多少生成类型，而是高意图作品在第 2、3 次修改后是否明显变好。",decision:"选 20 个有明确玩法意图的作品做“修改深度基准”：每个作品执行一次局部规则修改、一次结构修改、一次素材替换，记录未改部分保持率、修改成功率和耗时。若失败集中在同类编辑操作，优先补结构化编辑、锁定未改区域或版本回退，而不是新增更多模板。成功信号是修改成功率和第二版发布率同步提升，而非仅生成次数上涨。",limits:"这是单条用户评价，只能作为定性线索，不能代表 Aippy 整体用户；评价者地区不详，商店可见范围和功能可能因地区/版本不同。官方商店能力说明也不能证明 3D 输出质量、留存或增长效果。",sources:[{label:"Google Play · Aippy",url:"https://play.google.com/store/apps/details?id=com.nadaai.aippy"}]}
]},
{issue_id:"2026-09-14-no-new-verified-signals",title:"本期未发现足够核验的新增信号",date:"2026-09-14",range:"增量核验 · 2026-09-12 至 2026-09-14 08:48（北京时间）",summary:{play:"本期未发现足够核验、且相较 9 月 12 日基线具有实质增量的玩法信号，因此不新增玩法实验优先级。继续观察内容平台中的 AI 互动作品是否出现新的核心操作、分享接收者参与方式或明确的回访机制。",product:"本期未发现足够核验、且可支持调整产品优先级的新增证据。继续跟踪 AI 互动内容在推荐流、内容语境、首批分发和创作者反馈闭环中的实际开放范围与效果数据，避免把媒体线索或既有能力重复包装成产品结论。"},messages:[]},
{issue_id:"2026-09-12-baseline",title:"首期基线：互动、二创与分发",date:"2026-09-12",range:"公开资料基线 · 截至 2026-09-12",summary:{play:"传感器、分享链接与 Remix 都值得作为“互动原语”研究，但不能从能力说明直接推断留存或增长效果。",product:"内容生产之外，更应关注作品如何被理解、获得第一批玩家和反馈；B站 Toy 的内容连接方式提供了一个值得拆解的样本。"},messages:[
{id:"loopit-interaction-primitives",track:"play",platform:"Loopit",topic:"互动机制",title:"把设备能力变成低学习成本的互动原语",desc:"Loopit 的商店页把触摸、倾斜、声音、摄像头等作为互动方式，并强调可玩信息流与 Remix。值得研究的不是“用了传感器”，而是这些输入能否在几秒内让用户得到反馈。",fact:"Google Play 商店页描述了可玩信息流、Remix，以及触摸、倾斜、声音、摄像头等互动方式。",analysis:"如果互动输入本身足够直觉，用户无需理解复杂规则就能开始玩，这可能降低首次参与门槛；但能力是否实际带来更高完成率、分享或回访，公开资料没有证明。",decision:"从现有作品中挑选 3 类不依赖文字说明的输入方式，制作最小样本，对比首次有效操作完成率与首次反馈时间。",limits:"官方/开发者商店描述，不等于独立实测，也没有增长数据。",sources:[{label:"Google Play · Loopit",url:"https://play.google.com/store/apps/details?id=com.seedleap.loopitapp"}]},
{id:"aippy-shareable-links",track:"play",platform:"Aippy",topic:"分享传播",title:"分享链接把“结果传播”变成“接收者立即参与”",desc:"Aippy 的商店页强调互动内容可通过公开链接打开。对玩法广场更关键的问题是：分享接收者点开以后能做什么，而不是分享按钮本身。",fact:"Google Play 商店页描述了互动内容信息流、自定义素材、传感器玩法，以及无需安装 App 即可打开的公开分享链接。",analysis:"如果站外接收者无需先安装或理解平台，就可以直接进入核心互动，分享链路可能从展示结果升级为获得新参与者；但公开页面没有披露点击后的转化率。",decision:"选择天然适合邀请别人参与的玩法，设计“分享者结果 + 接收者一步进入互动”的链路，分别记录打开率、首次有效操作率和后续广场消费率。",limits:"这里只确认产品宣称的链接能力，不确认不同地区、设备或版本的实际可用范围。",sources:[{label:"Google Play · Aippy",url:"https://play.google.com/store/apps/details?id=com.nadaai.aippy"}]},
{id:"loopit-remix-supply",track:"play",platform:"Loopit",topic:"二创",title:"Remix 值得按“玩法家族”而不是单个爆款研究",desc:"当用户能从一个作品快速产生变体时，真正值得看的不是二创数量，而是变体是否带来新的受众、情境和互动价值。",fact:"Loopit 的官方商店描述包含 Remix 能力。",analysis:"Remix 可能降低从消费者到创作者的转换成本，但也可能快速制造大量相似内容。对你们而言，应该同时看供给增长和差异化质量。",decision:"为可二创作品记录原作→变体树：变更了主题、素材、规则还是反馈；用“产生有效差异的二创占比”而不只是二创总量评估机制。",limits:"没有公开证据证明 Loopit 的 Remix 已经形成高质量创作者生态。",sources:[{label:"Google Play · Loopit",url:"https://play.google.com/store/apps/details?id=com.seedleap.loopitapp"}]},
{id:"bilibili-toy-distribution-context",track:"product",platform:"哔哩哔哩 Toy",topic:"内容分发",title:"作品不一定需要独立广场承担全部“解释成本”",desc:"B站 Toy 官方介绍强调互动内容可与视频、动态、评论区连接。值得研究的是既有内容语境如何帮助用户先理解“为什么要玩”，再进入互动。",fact:"B站 Toy 官方介绍将其定位为互动内容发布平台，支持测试、小游戏、工具等，并描述与视频、动态、评论区等场景的连接。",analysis:"创作者已有内容和粉丝关系可能承担作品冷启动与解释成本。对广场而言，这提示我们不仅要优化推荐，还要研究作品能否挂靠在更容易理解的内容情境上。",decision:"对当前作品拆分“看懂作品”与“真正开玩”两个漏斗；挑选能与帖子/视频/话题关联的作品，验证带情境入口是否提升开玩率。",limits:"官方介绍说明能力存在，不代表所有入口都已对所有创作者开放，也不能据此断言其分发效率更高。",sources:[{label:"哔哩哔哩 Toy · 官方介绍",url:"https://www.bilibili.com/toy/intro"}]},
{id:"bilibili-toy-feedback-loop",track:"product",platform:"哔哩哔哩 Toy",topic:"创作者反馈",title:"第一批玩家和反馈可能比更多生成功能更稀缺",desc:"如果创作者发布后没有真实玩家反馈，很难判断应该继续修改什么。B站 Toy 与社区内容场景连接，值得作为“创作—发布—反馈”闭环样本继续观察。",fact:"B站 Toy 官方介绍描述了互动内容发布，以及与站内内容场景的连接；平台还提供测试、审核和更新相关能力。",analysis:"对于供给质量不高的平台，问题可能不仅是创作工具弱，也可能是作品发布之后没有合适用户帮助作者迭代。外部资料只能提示这一研究方向，不能替代内部创作者行为数据。",decision:"抽样访谈三类人：发布一次即停止、持续修改、持续高质量创作。重点记录发布后多久收到第一批真实玩家、反馈是否推动了下一次修改。",limits:"尚无证据确认你们当前最主要瓶颈就在反馈环节，应通过内部数据验证。",sources:[{label:"哔哩哔哩 Toy · 官方介绍",url:"https://www.bilibili.com/toy/intro"}]},
{id:"quality-layering-framework",track:"product",platform:"内部方法",topic:"供给质量",title:"先把“劣质作品”拆成可用性、体验、内容和匹配四层",desc:"同样表现差的作品可能需要完全不同的产品动作：运行失败应修工具，规则难懂应修表达，重复换皮应改创作引导，送错人则是分发问题。",fact:"这是基于当前产品阶段提出的研究框架，不是来自单一外部竞品的事实。",analysis:"若没有分层，平台容易把所有低表现都归因于创作者质量，并同时投入工具、推荐和运营，最终无法判断哪项改动有效。",decision:"固定抽样新作、头部和长尾，对每件作品分别判断可用性、体验质量、内容差异和受众匹配；同时寻找“体验不错但曝光不足”的反例。",limits:"需要内部作品、曝光、开玩和行为数据后才能形成真正的根因排序。",sources:[]}
]}];

const STORE_KEY="ai_games_insights_read_v2";
let readState={};
let storageMode="localStorage";
function loadRead(){try{const raw=localStorage.getItem(STORE_KEY);readState=raw?JSON.parse(raw):{};if(!readState||typeof readState!=="object")readState={};}catch(e){readState={};storageMode="unavailable";}}
function saveRead(){try{localStorage.setItem(STORE_KEY,JSON.stringify(readState));storageMode="localStorage";return true}catch(e){storageMode="unavailable";return false}}
function isRead(id){return !!readState[id]}
function setRead(id,val=true){if(val)readState[id]=new Date().toISOString();else delete readState[id];saveRead();renderCurrent();toast(val?"已标记为已读":"已恢复为未读")}
function allMessages(){return issues.flatMap(i=>i.messages.map(m=>({...m,issue_id:i.issue_id,issue_date:i.date,issue_title:i.title})))}
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function trackLabel(t){return t==="play"?"玩法机会":"产品迭代"}
function progressFor(issue){const total=issue.messages.length;const read=issue.messages.filter(m=>isRead(m.id)).length;return{total,read,pct:total?Math.round(read/total*100):0}}
function markIssue(issue,val=true){const prev=JSON.stringify(readState);issue.messages.forEach(m=>val?readState[m.id]=new Date().toISOString():delete readState[m.id]);saveRead();renderCurrent();toastAction(val?`本期 ${issue.messages.length} 条已全部标记为已读`:`本期已全部恢复未读`,()=>{readState=JSON.parse(prev);saveRead();renderCurrent()})}
function markList(list,val=true){const prev=JSON.stringify(readState);list.forEach(m=>val?readState[m.id]=new Date().toISOString():delete readState[m.id]);saveRead();renderCurrent();toastAction(val?`已标记 ${list.length} 条为已读`:`已恢复 ${list.length} 条为未读`,()=>{readState=JSON.parse(prev);saveRead();renderCurrent()})}
function itemHtml(m){const read=isRead(m.id);return `<article class="item ${read?"read":""}" data-id="${esc(m.id)}"><div class="item-top"><span class="tag ${m.track}">${trackLabel(m.track)}</span><span class="tag source">${esc(m.platform)}</span><span class="tag source">${esc(m.topic)}</span>${read?"":"<span class=\"unread-dot\" title=\"未读\"></span>"}</div><div class="item-title">${esc(m.title)}</div><p class="item-desc">${esc(m.desc)}</p><div class="item-footer"><div class="item-meta"><span>${esc(m.issue_date||issues[0].date)}</span><span class="read-indicator">${read?"已读":"未读"}</span></div><button class="read-btn ${read?"done":""}" data-read-toggle="${esc(m.id)}">${read?"标记未读":"标记已读"}</button><button class="detail-link" data-detail="${esc(m.id)}">查看详情 →</button></div></article>`}
function latestHtml(){const issue=issues[0],p=progressFor(issue);return `<div class="hero"><div class="hero-main"><div class="eyebrow">LATEST BRIEF · ${esc(issue.date)}</div><h1>${esc(issue.title)}</h1><p>用于回答两个问题：哪些新互动值得验证，以及哪些产品能力最值得优先改善。只展示有证据边界的信号，不把“上线”直接写成“有效”。</p><div class="hero-meta"><span class="pill">${esc(issue.range)}</span><span class="pill">${issue.messages.length} 条观察</span><span class="pill">${p.read}/${p.total} 已读</span></div></div><aside class="hero-side"><div><h3>本期阅读进度</h3><div class="progress-track"><div class="progress-bar" style="width:${p.pct}%"></div></div><div class="progress-label">${p.pct}% · 还剩 ${p.total-p.read} 条</div></div><div class="bulk-actions"><button class="ghost-btn" data-issue-all-read="${issue.issue_id}">本期全部已读</button>${p.read?`<button class="ghost-btn" data-issue-all-unread="${issue.issue_id}">全部恢复未读</button>`:""}</div></aside></div><div class="section"><div class="section-head"><div><h2>本期判断</h2><div class="section-sub">先看结论，再决定是否展开具体消息。</div></div></div><div class="summary-grid"><div class="summary-card"><div class="summary-label play">玩法机会</div><h3>什么值得做成下一批玩法实验？</h3><p>${esc(issue.summary.play)}</p></div><div class="summary-card"><div class="summary-label product">产品迭代</div><h3>什么值得改变下一轮产品优先级？</h3><p>${esc(issue.summary.product)}</p></div></div></div><div class="section"><div class="section-head"><div><h2>本期消息</h2><div class="section-sub">阅读状态由你手动确认；打开详情不会自动变成已读。</div></div><span class="counter">${p.total-p.read} 条未读</span></div><div class="feed">${issue.messages.map(m=>itemHtml({...m,issue_date:issue.date})).join("")}</div></div>`}
let feedFilters={q:"",track:"all",read:"all",platform:"all"};
function filteredMessages(){const q=feedFilters.q.trim().toLowerCase();return allMessages().filter(m=>{if(feedFilters.track!=="all"&&m.track!==feedFilters.track)return false;if(feedFilters.read==="read"&&!isRead(m.id))return false;if(feedFilters.read==="unread"&&isRead(m.id))return false;if(feedFilters.platform!=="all"&&m.platform!==feedFilters.platform)return false;if(q&&!`${m.title} ${m.desc} ${m.platform} ${m.topic} ${m.fact} ${m.analysis}`.toLowerCase().includes(q))return false;return true})}
function feedHtml(){const list=filteredMessages(),platforms=[...new Set(allMessages().map(m=>m.platform))].sort();return `<div class="section" style="margin-top:0"><div class="section-head"><div><h2>全部消息</h2><div class="section-sub">跨期搜索和筛选。已读状态与筛选条件可以组合。</div></div><span class="counter">显示 ${list.length} / ${allMessages().length}</span></div><div class="feed-toolbar"><div class="search"><input id="feedSearch" value="${esc(feedFilters.q)}" placeholder="搜索玩法、竞品、主题或判断…"></div><select id="platformSelect" class="select" style="width:auto;min-width:150px"><option value="all">全部竞品</option>${platforms.map(p=>`<option ${feedFilters.platform===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div><div class="feed-toolbar"><div class="filter-group">${[["all","全部"],["play","玩法机会"],["product","产品迭代"]].map(([v,l])=>`<button class="filter-btn ${feedFilters.track===v?"active":""}" data-track-filter="${v}">${l}</button>`).join("")}</div><div class="filter-group">${[["all","全部状态"],["unread","未读"],["read","已读"]].map(([v,l])=>`<button class="filter-btn ${feedFilters.read===v?"active":""}" data-read-filter="${v}">${l}</button>`).join("")}</div><div class="bulk-actions" style="margin-left:auto"><button class="ghost-btn" id="markFilteredRead">当前结果全部已读</button></div></div>${list.length?`<div class="feed">${list.map(itemHtml).join("")}</div>`:`<div class="empty">没有符合当前筛选条件的消息。</div>`}</div>`}
function archiveHtml(){return `<div class="section" style="margin-top:0"><div class="section-head"><div><h2>历史归档</h2><div class="section-sub">每一期都永久保留，不用翻聊天记录寻找过去的判断。</div></div></div><div class="archive-list">${issues.map(i=>{const p=progressFor(i);return `<div class="archive-card"><div class="archive-date">${esc(i.date)}</div><div class="archive-main"><strong>${esc(i.title)}</strong><span>${i.messages.length} 条 · ${p.total-p.read} 条未读</span></div><div class="archive-progress"><div class="progress-track"><div class="progress-bar" style="width:${p.pct}%"></div></div><div class="progress-label">${p.read}/${p.total} 已读</div></div><button class="ghost-btn" data-open-issue="${i.issue_id}">查看本期</button></div>`}).join("")}</div></div>`}
function competitorsHtml(){const groups={};allMessages().forEach(m=>(groups[m.platform]??=[]).push(m));return `<div class="section" style="margin-top:0"><div class="section-head"><div><h2>竞品观察</h2><div class="section-sub">按对象沉淀历次变化与研究问题，而不是每周重新写一遍竞品简介。</div></div></div>${Object.entries(groups).map(([p,list])=>`<div class="summary-card" style="margin-bottom:12px"><div class="section-head" style="margin-bottom:8px"><div><h2 style="font-size:17px">${esc(p)}</h2><div class="section-sub">${list.length} 条历史观察 · ${list.filter(m=>!isRead(m.id)).length} 条未读</div></div></div><div class="feed">${list.map(itemHtml).join("")}</div></div>`).join("")}</div>`}
function settingsHtml(){const exported=esc(JSON.stringify({version:2,exported_at:new Date().toISOString(),read:readState},null,2));return `<div class="section" style="margin-top:0"><div class="section-head"><div><h2>更新与阅读状态</h2><div class="section-sub">当前版本仍是静态站点首版；阅读状态保存在当前浏览器。</div></div></div><div class="notice">重要：本页面当前通过浏览器本地存储保存已读状态，因此不会自动跨设备同步。正式团队站点应改为登录账号 + 服务端存储，每位成员独立记录阅读状态。</div><div class="settings-grid"><div class="settings-card"><h3>当前存储状态</h3><p>${storageMode==="localStorage"?"已启用浏览器本地保存。关闭再打开同一站点，通常仍能保留阅读记录。":"当前环境无法写入浏览器本地存储；本次阅读记录可能无法持久保存。"}</p><p class="small-note">已标记 ${Object.keys(readState).length} 条。仅点击“标记已读”才会更新。</p></div><div class="settings-card"><h3>批量管理</h3><p>适合测试或重新开始阅读。清空操作只影响当前浏览器。</p><div class="bulk-actions" style="margin-top:12px"><button class="ghost-btn" id="allRead">全部标记已读</button><button class="ghost-btn danger" id="clearRead">清空阅读记录</button></div></div><div class="settings-card"><h3>导出阅读记录</h3><p>更换浏览器或站点路径前，可复制这段 JSON 作为备份。</p><textarea readonly id="exportArea">${exported}</textarea><button class="ghost-btn" id="copyExport" style="margin-top:8px">复制</button></div><div class="settings-card"><h3>导入阅读记录</h3><p>粘贴之前导出的 JSON。已有记录会与导入内容合并。</p><textarea id="importArea" placeholder='粘贴 {"version":2,"read":{...}}'></textarea><button class="ghost-btn" id="importBtn" style="margin-top:8px">导入</button></div></div><div class="section"><h2 style="font-size:17px">正式版建议</h2><div class="qa-card"><strong>阅读状态</strong>按用户账号存储 message_id、read_at；任何新一期发布都不能覆盖已有用户状态。</div><div class="qa-card"><strong>历史归档</strong>每次发布新增 issue，不修改过往 issue；需要更正时保留修订记录。</div><div class="qa-card"><strong>自动更新</strong>研究任务生成结构化数据 → 校验来源和唯一 ID → 发布 → 重新读取验证 → 通知。发布失败不改变“最新一期”。</div></div></div>`}
function issueStandalone(issue){const p=progressFor(issue);return `<div class="section" style="margin-top:0"><div class="section-head"><div><div class="eyebrow">ARCHIVE · ${esc(issue.date)}</div><h2 style="font-size:28px;margin-top:5px">${esc(issue.title)}</h2><div class="section-sub">${esc(issue.range)}</div></div><button class="ghost-btn" data-view-jump="archive">← 返回归档</button></div><div class="summary-grid"><div class="summary-card"><div class="summary-label play">玩法机会</div><p>${esc(issue.summary.play)}</p></div><div class="summary-card"><div class="summary-label product">产品迭代</div><p>${esc(issue.summary.product)}</p></div></div><div class="feed-toolbar"><span class="counter">${p.read}/${p.total} 已读</span><button class="ghost-btn" data-issue-all-read="${issue.issue_id}">本期全部已读</button></div><div class="feed">${issue.messages.map(m=>itemHtml({...m,issue_date:issue.date})).join("")}</div></div>`}
let currentView="latest",customIssue=null;
function renderCurrent(){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));const el=document.getElementById(`view-${currentView}`);el.classList.add("active");if(currentView==="latest")el.innerHTML=customIssue?issueStandalone(customIssue):latestHtml();if(currentView==="feed")el.innerHTML=feedHtml();if(currentView==="archive")el.innerHTML=archiveHtml();if(currentView==="competitors")el.innerHTML=competitorsHtml();if(currentView==="settings")el.innerHTML=settingsHtml();bindDynamic();document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.view===currentView&&!customIssue));}
function go(view){currentView=view;customIssue=null;location.hash=view;renderCurrent();window.scrollTo({top:0,behavior:"smooth"})}
function bindDynamic(){document.querySelectorAll("[data-read-toggle]").forEach(b=>b.onclick=()=>setRead(b.dataset.readToggle,!isRead(b.dataset.readToggle)));document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));document.querySelectorAll("[data-issue-all-read]").forEach(b=>b.onclick=()=>{const i=issues.find(x=>x.issue_id===b.dataset.issueAllRead);if(i)markIssue(i,true)});document.querySelectorAll("[data-issue-all-unread]").forEach(b=>b.onclick=()=>{const i=issues.find(x=>x.issue_id===b.dataset.issueAllUnread);if(i)markIssue(i,false)});document.querySelectorAll("[data-open-issue]").forEach(b=>b.onclick=()=>{customIssue=issues.find(x=>x.issue_id===b.dataset.openIssue);currentView="latest";renderCurrent();window.scrollTo({top:0,behavior:"smooth"})});document.querySelectorAll("[data-view-jump]").forEach(b=>b.onclick=()=>go(b.dataset.viewJump));document.querySelectorAll("[data-track-filter]").forEach(b=>b.onclick=()=>{feedFilters.track=b.dataset.trackFilter;renderCurrent()});document.querySelectorAll("[data-read-filter]").forEach(b=>b.onclick=()=>{feedFilters.read=b.dataset.readFilter;renderCurrent()});const q=document.getElementById("feedSearch");if(q)q.oninput=e=>{feedFilters.q=e.target.value;const pos=e.target.selectionStart;document.getElementById("view-feed").innerHTML=feedHtml();bindDynamic();const n=document.getElementById("feedSearch");n.focus();n.setSelectionRange(pos,pos)};const ps=document.getElementById("platformSelect");if(ps)ps.onchange=e=>{feedFilters.platform=e.target.value;renderCurrent()};const mfr=document.getElementById("markFilteredRead");if(mfr)mfr.onclick=()=>markList(filteredMessages(),true);const all=document.getElementById("allRead");if(all)all.onclick=()=>markList(allMessages(),true);const clear=document.getElementById("clearRead");if(clear)clear.onclick=()=>{const prev=JSON.stringify(readState);readState={};saveRead();renderCurrent();toastAction("阅读记录已清空",()=>{readState=JSON.parse(prev);saveRead();renderCurrent()})};const copy=document.getElementById("copyExport");if(copy)copy.onclick=async()=>{const t=document.getElementById("exportArea").value;try{await navigator.clipboard.writeText(t);toast("已复制阅读记录")}catch(e){document.getElementById("exportArea").select();toast("已选中，请手动复制")}};const imp=document.getElementById("importBtn");if(imp)imp.onclick=()=>{try{const obj=JSON.parse(document.getElementById("importArea").value);if(!obj.read||typeof obj.read!=="object")throw new Error();readState={...readState,...obj.read};saveRead();renderCurrent();toast("阅读记录已导入")}catch(e){toast("导入失败：请检查 JSON 格式")}}}
function openDetail(id){const m=allMessages().find(x=>x.id===id);if(!m)return;const read=isRead(id);document.getElementById("modalLabel").textContent=`${m.platform} · ${m.topic}`;document.getElementById("modalBody").innerHTML=`<div class="item-top"><span class="tag ${m.track}">${trackLabel(m.track)}</span><span class="tag source">${esc(m.issue_date)}</span><span class="read-indicator">${read?"已读":"未读"}</span></div><div class="detail-title">${esc(m.title)}</div><p class="detail-lead">${esc(m.desc)}</p><div class="detail-section"><h4>已知事实</h4><p>${esc(m.fact)}</p></div><div class="detail-section"><h4>分析判断</h4><p>${esc(m.analysis)}</p></div><div class="detail-section"><h4>建议验证</h4><p>${esc(m.decision)}</p></div><div class="detail-section"><h4>证据边界</h4><p>${esc(m.limits)}</p></div><div class="detail-section"><h4>原始来源</h4>${m.sources.length?`<ul class="source-list">${m.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("")}</ul>`:'<p>内部研究框架，无单一外部来源。</p>'}</div><div class="detail-actions"><button class="read-btn ${read?"done":""}" id="modalRead">${read?"标记未读":"标记为已读"}</button>${!read?`<button class="ghost-btn" id="readNext">标记已读，读下一条 →</button>`:""}</div>`;document.getElementById("modalBackdrop").classList.add("open");document.getElementById("modalRead").onclick=()=>{setRead(id,!isRead(id));openDetail(id)};const rn=document.getElementById("readNext");if(rn)rn.onclick=()=>{readState[id]=new Date().toISOString();saveRead();const list=allMessages();const idx=list.findIndex(x=>x.id===id);const next=list.slice(idx+1).find(x=>!isRead(x.id))||list.find(x=>!isRead(x.id));renderCurrent();if(next)openDetail(next.id);else{closeModal();toast("全部消息都已读完")}}}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open")}
document.getElementById("modalClose").onclick=closeModal;document.getElementById("modalBackdrop").onclick=e=>{if(e.target===e.currentTarget)closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});document.querySelectorAll("#nav a").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.view)});
let toastTimer;function toast(msg){const t=document.getElementById("toast");t.innerHTML=esc(msg);t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function toastAction(msg,undo){const t=document.getElementById("toast");t.innerHTML=`${esc(msg)} <button id="toastUndo" style="margin-left:9px;border:0;border-radius:7px;padding:4px 7px;cursor:pointer">撤销</button>`;t.classList.add("show");document.getElementById("toastUndo").onclick=()=>{undo();t.classList.remove("show");toast("已撤销")};clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),5000)}
loadRead();
const initial=location.hash.replace("#","");if(["latest","feed","archive","competitors","settings"].includes(initial))currentView=initial;renderCurrent();
</script>
</body>
</html>
